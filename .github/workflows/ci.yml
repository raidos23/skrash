name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            python3-venv \
            libsdl2-dev \
            libzip-dev

      - name: Set up Python test environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install "pytest>=8"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build and run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          make clean
          make all

          for test in build/*.bin; do
            [ "$test" = "build/test_coverage.bin" ] && continue
            echo "=== $test ==="
            timeout 30s "./$test" || {
              echo "ERROR: $test failed or timed out"
              exit 1
            }
          done

          echo ""
          echo "=== Python tests ==="
          timeout 60s python3 -m pytest -s
