name: Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, test and publish
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Refusing to release: the tagged commit is not on main."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libzip-dev libsdl2-dev

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Build and run automated tests
        shell: bash
        run: |
          set -euo pipefail
          make all
          for test in build/*.bin; do
            # test_coverage is a manual diagnostic requiring an explicit .sb3 path.
            if [[ "$(basename "$test")" == "test_coverage.bin" ]]; then
              echo "Skipping manual coverage diagnostic (requires an .sb3 argument)"
              continue
            fi
            echo "=== $test ==="
            "$test"
          done
          python -m pytest -s

      - name: Build the standalone player
        run: make play

      - name: Package Linux executable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/skrash-play release/
          archive="skrash-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          tar -C release -czf "$archive" skrash-play
          sha256sum "$archive" > SHA256SUMS

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Skrash ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            skrash-${{ github.ref_name }}-linux-x86_64.tar.gz
            SHA256SUMS
