name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, test and publish
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libzip-dev libsdl2-dev

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Build and run the test suite
        run: make test

      - name: Build the standalone player
        run: make play

      - name: Package Linux executable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/skrash-play release/
          tar -C release -czf "skrash-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" skrash-play
          sha256sum "skrash-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" > SHA256SUMS
          
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Skrash ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            skrash-${{ github.ref_name }}-linux-x86_64.tar.gz
            SHA256SUMS
