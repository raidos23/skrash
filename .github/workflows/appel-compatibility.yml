name: APPEL Compatibility

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  appel-coverage:
    name: Analyze APPEL block coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            libsdl2-dev \
            libzip-dev \
            unzip

      - name: Build Skrash and test tools
        run: make all

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Scratch project downloader
        run: npm install --global --ignore-scripts @turbowarp/sbdl@7.0.0

      - name: Download APPEL from Scratch
        id: appel
        env:
          SCRATCH_PROJECT_ID: "60917032"
        run: |
          set -euo pipefail

          project_dir="$RUNNER_TEMP/skrash-appel"
          mkdir -p "$project_dir"

          # sbdl resolves Scratch project metadata and its project token,
          # downloads the project and assets, then rebuilds a valid .sb3.
          (
            cd "$project_dir"
            sbdl "$SCRATCH_PROJECT_ID"
          )

          mapfile -t projects < <(
            find "$project_dir" -maxdepth 1 -type f -name '*.sb3' -print
          )

          if [ "${#projects[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one downloaded SB3 project; found ${#projects[@]}."
            exit 1
          fi

          project_file="$project_dir/appel.sb3"
          mv "${projects[0]}" "$project_file"

          test -s "$project_file"
          unzip -tq "$project_file"
          unzip -Z1 "$project_file" | grep -qx 'project.json'

          echo "project_file=$project_file" >> "$GITHUB_OUTPUT"

      - name: Run APPEL block coverage analysis
        env:
          APPEL_PROJECT_FILE: ${{ steps.appel.outputs.project_file }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/appel-coverage-report.txt"

          timeout 120s ./build/test_coverage.bin "$APPEL_PROJECT_FILE" | tee "$report"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appel-coverage-report
          path: ${{ runner.temp }}/appel-coverage-report.txt
          if-no-files-found: warn
          retention-days: 14
